<!-- Objet : Choisissez un nouveau mot de passe -->
<div style="font-family: Poppins, Helvetica, Arial, sans-serif; background:#F4EDE4; padding:32px 16px; color:#3B3330;">
  <div style="max-width:480px; margin:0 auto; background:#FFFDFA; border-radius:20px; padding:32px 24px; text-align:center;">
    <p style="font-size:16px; letter-spacing:4px; font-weight:300; margin:0;">LAURA WEDDINGS &amp; EVENTS</p>
    <div style="width:40px; height:1px; background:#A07E5E; margin:12px auto 28px;"></div>
    <p style="font-size:16px; margin:0 0 24px;">Bonjour,<br>touchez le bouton ci-dessous pour choisir un nouveau mot de passe.</p>
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery"
       style="display:inline-block; background:#A07E5E; color:#FFFDFA; text-decoration:none; padding:16px 28px; border-radius:999px; font-size:16px;">
      Choisir un nouveau mot de passe
    </a>
    <p style="font-size:13px; color:#6E625C; margin:28px 0 0;">Si vous n'avez rien demandé, ignorez cet e-mail : votre mot de passe ne change pas.</p>
  </div>
</div>
