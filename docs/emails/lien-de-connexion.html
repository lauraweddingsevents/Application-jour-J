<div style="font-family: Poppins, Helvetica, Arial, sans-serif; background:#F4EDE4; padding:32px 16px; color:#3B3330;">
  <div style="max-width:480px; margin:0 auto; background:#FFFDFA; border-radius:20px; padding:32px 24px; text-align:center;">
    <p style="font-size:20px; letter-spacing:4px; font-weight:300; margin:0;">MA COORDO</p>
    <div style="width:40px; height:1px; background:#A07E5E; margin:12px auto 28px;"></div>
    <p style="font-size:16px; margin:0 0 24px;">Bonjour,<br>voici votre lien pour accéder à vos mariages.</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="display:inline-block; background:#A07E5E; color:#FFFDFA; text-decoration:none; padding:16px 28px; border-radius:999px; font-size:16px;">
      Me connecter
    </a>
    <p style="font-size:14px; color:#6E625C; margin:28px 0 8px;">Ou saisissez ce code dans l'application :</p>
    <p style="font-size:26px; letter-spacing:6px; margin:0;"><strong>{{ .Token }}</strong></p>
    <p style="font-size:13px; color:#6E625C; margin:28px 0 0;">Ce lien est valable une heure. Si vous n'avez rien demandé, ignorez simplement cet e-mail.</p>
  </div>
  <p style="text-align:center; font-size:12px; color:#6E625C; margin-top:16px;">Ma Coordo · Laura Weddings &amp; Events</p>
</div>
